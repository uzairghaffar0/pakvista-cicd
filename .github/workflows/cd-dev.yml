name: CD - Development

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Step 2: Declare the appropriate GitHub Environment
    environment: development

    steps:
      # Step 1: Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 3: Send an HTTP POST request to the Render deploy hook URL
      - name: Trigger Render Deploy
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_DEV_URL }}"

      # Step 4: Output confirmation
      - name: Confirm Deployment
        run: |
          echo "Deployment to development environment triggered at $(date)"
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trigger Render Deploy Hook
        # Sends a POST request to Render to trigger deployment
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_DEV_URL }}

      - name: Deployment Confirmation
        run: |
          echo "Deployment to development triggered at $(date)"
